<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Sistema Acadêmico DS II</title>
    <link rel="stylesheet" href="./css/estilo.css">

    <!--
        Ordem de carregamento: Model, View e Controller.
        Com defer, os scripts rodam nessa ordem depois que o HTML é lido;
        o Controller vem por último porque depende dos outros dois.
    -->
    <script
        src="./js/model/aluno-model.js"
        defer>
    </script>
    <script
        src="./js/view/aluno-view.js"
        defer>
    </script>
    <script
        src="./js/controller/aluno-controller.js"
        defer>
    </script>
</head>

<body>
    <main>
        <h1>Sistema Acadêmico DS II</h1>

        <p>
            Primeira versão do sistema utilizando MVC e JSON.
        </p>

        <p>
            Abra o console do navegador para acompanhar
            a execução.
        </p>
    </main>
</body>

</html>
